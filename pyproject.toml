[project]
name = "unitrefine"
version = "0.2.0"
description = "UnitRefine is a machine-learning toolbox that simplifies spike sorting curation by reducing manual curation."
authors = [
    { name = "Anoushka Jain", email = "jain.anoushka3@gmail.com" },
    { name = "Chris Halcrow", email = "chrishalcrow@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["spike sorting", "curation", "electrophysiology", "machine learning", "neuropixels", "spikeinterface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# what applying models needs, also without a screen, e.g. on a computing cluster (unitrefine-apply, see docs/hpc.md)
dependencies = [
    "numcodecs==0.15.1",
    "numba>=0.61.0",
    "pandas>=2.2.3",
    "spikeinterface>=0.105.0",
    "pyyaml>=6.0.2",
    "scikit-learn==1.7",
    "skops>=0.11.0",
    "huggingface-hub>=0.35.0",
    "s3fs>=2025.10.0",
    # reading compressed IBL recordings (.cbin), e.g. for + Phy output
    "mtscomp>=1.0.2",
]

[project.optional-dependencies]
# the GUI: pip install "unitrefine[gui]". `uv sync` installs it too (see default-groups below)
gui = [
    "spikeinterface-gui>=0.14.0",
    "pyqtgraph>=0.13.7",
    "pyqt5>=5.15.11",
    "pyqt5-qt5<5.15.18; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "pyqt5-qt5>=5.15.0; sys_platform == 'darwin'",
    "pyqt5-qt5>=5.15.0; sys_platform == 'linux'",
    "matplotlib>=3.8",
    "shap>=0.49.1",
]

[project.urls]
Homepage = "https://github.com/anoushkajain/UnitRefine"
Documentation = "https://github.com/anoushkajain/UnitRefine#readme"
Issues = "https://github.com/anoushkajain/UnitRefine/issues"
Preprint = "https://www.biorxiv.org/content/10.1101/2025.03.30.645770v2"
Models = "https://huggingface.co/AnoushkaJain3"

[build-system]
# 77: the license as `license = "MIT"`
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# resources holds the images and fonts used by the GUI
packages = ["unitrefine", "unitrefine.resources", "unitrefine.resources.fonts"]
package-dir = {"unitrefine" = "src/unitrefine"}

[tool.setuptools.package-data]
"unitrefine.resources" = ["*"]
"unitrefine.resources.fonts" = ["*"]

[project.scripts]
unitrefine = "unitrefine.launcher:main"
# without the GUI, e.g. on a computing cluster (see src/unitrefine/cli.py)
unitrefine-apply = "unitrefine.cli:apply_main"
unitrefine-download-models = "unitrefine.cli:download_main"

[dependency-groups]
# for running the tests: uv run pytest
dev = ["pytest>=8"]
# so `uv sync` installs the GUI, as it always has. Without it: uv sync --no-group gui
gui = ["unitrefine[gui]"]

[tool.uv]
default-groups = ["dev", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # from the small synthetic recordings the tests make
    "ignore::UserWarning:spikeinterface.*",
    "ignore::DeprecationWarning",
]


